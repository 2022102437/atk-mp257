# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

# This folder should only contains specific patches to fix issue on oe recipes
# Note that these patches may be pushed on Community
BBFILES += "${LAYERDIR}/oe-core/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "stm-tsn-base"
BBFILE_PATTERN_stm-tsn-base = "^${LAYERDIR}/"
BBFILE_PRIORITY_stm-tsn-base = "6"
LICENSE_PATH += "${LAYERDIR}/TTTECH-license"
SPDXLICENSEMAP[Commercial] = "TTTECH_license.txt"
# Set a variable to get the meta-st-stm32mp-tsn-swch location
TSN_BASE_LAYER = "${LAYERDIR}"

# OpenSTLinux compatibility version
ST_OSTL_COMPATIBILITY_VERSION_stm-tsn-base = "6.0 6.1 6.2"

# This should only be incremented on significant changes that will
# cause compatibility issues with other layers
LAYERVERSION_stm-tsn-base = "1"
LAYERSERIES_COMPAT_stm-tsn-base = "scarthgap"

# Usage of SOURCE
TSN_SRC_URI = "git://github.com/STMicroelectronics/tttech-tsn-swch-content;protocol=https;branch=1.6.9-binaries"
TSN_SRCREV = "cc3610597153462dce3b207592354ef6c21d9bfe"

# Name of default ethernet interface for bridge support (aka ETH1 phy or devicetree alias ethernet1)
# NOTE: verify at runtime that the interface use for the switch is associated to ETH1 phy
DEFAULT_ETHERNET_MAIN_TSN_BRIDGE_INTERFACE ??= "${@bb.utils.contains('DISTRO_FEATURES', 'systemd', 'end1', 'eth0', d)}"

# there is several profile available:
# SWITCH: only switch managed by networkd (no TSN configuration, no yang, no snmp)
# TSN_NETWORKD: switch and tsn a present but separated on switch configuration, networkd configuration and tsn services
# TSN_MONO: only tsn configuration (with contain switch) and tsn services
TSN_PROFILE ??= "TSN_NETWORKD"
