#@TYPE: Machine
#@NAME: stm32mp257-atk
#@DESCRIPTION: Configuration for the Alientek(正点原子) STM32MP257 development board (ATK-MP257 core board), eMMC boot
#@NEEDED_BSPLAYERS: atk-mp257/meta-openembedded/meta-oe atk-mp257/meta-openembedded/meta-python

# Define specific familly common machine name
MACHINEOVERRIDES =. "stm32mp2common:stm32mp25common:"

include conf/machine/include/st-machine-common-stm32mp.inc
include conf/machine/include/st-machine-providers-stm32mp.inc

# =========================================================================
# Chip architecture
# =========================================================================
DEFAULTTUNE = "cortexa35"
include conf/machine/include/arm/armv8a/tune-cortexa35.inc

# =========================================================================
# boot scheme
# =========================================================================
BOOTSCHEME_LABELS = "optee"

# =========================================================================
# boot device
# =========================================================================
# The ATK-MP257 core board boots from its on-board eMMC
BOOTDEVICE_LABELS += "emmc"

# =========================================================================
# Machine settings
# =========================================================================
# activate external dt (boot chain device trees come from dt-stm32mp)
EXTERNAL_DT_ENABLED = "1"

# Kernel devicetree per supported storage
# NOTE: the Alientek board dts sources are injected into the kernel by the
#       linux-stm32mp bbappend from this layer.
# Base board (2GB DDR). Display variants (rgb/mipi/lvds) build fine; to use one
# instead, e.g.:
#   STM32MP_DT_FILES_EMMC += "stm32mp257d-atk-ddr-2GB-rgb"
STM32MP_DT_FILES_EMMC += "stm32mp257d-atk-ddr-2GB"

# Boot chain devicetrees (TF-A / OP-TEE / U-Boot / FIP):
# Use the Alientek board device trees (DDR4 2x8Gbits 1200MHz) injected by the
# external-dt bbappend from this layer.
EXTERNAL_DEVICETREE_EMMC = "stm32mp257d-atk-ddr-2GB"

# =========================================================================
# Machine features
# =========================================================================
MACHINE_FEATURES += "splashscreen"
MACHINE_FEATURES += "watchdog"

# GPU / multimedia acceleration (Vivante): requires EULA acceptance, so it is
# enabled only when ACCEPT_EULA_stm32mp257-atk = "1" is set in local.conf
MACHINE_FEATURES += "${@'gpu' if d.getVar('ACCEPT_EULA_'+d.getVar('MACHINE')) == '1' else ''}"
#MACHINE_FEATURES += "${@'openvx' if d.getVar('ACCEPT_EULA_'+d.getVar('MACHINE')) == '1' else ''}"
#MACHINE_FEATURES += "${@'opencl' if d.getVar('ACCEPT_EULA_'+d.getVar('MACHINE')) == '1' else ''}"
#MACHINE_FEATURES += "${@'vulkan' if d.getVar('ACCEPT_EULA_'+d.getVar('MACHINE')) == '1' else ''}"

# M33 co-processor support (CM33 in non-secure world)
MACHINE_FEATURES += "m33copro"
# M0 co-processor support
#MACHINE_FEATURES += "m0copro"

# Wifi / Bluetooth (only if your board ships a wireless module)
#MACHINE_FEATURES += "wifi"
#MACHINE_FEATURES += "bluetooth"
#WIFI_LIST += "linux-firmware-addons-bcm43xx"
#BLUETOOTH_LIST += "linux-firmware-addons-bcm43xx"

# =========================================================================
# OPTEE
# =========================================================================
# For sdk generation, declare the default board configuration to use.
ST_OPTEE_EXPORT_TA_REF_BOARD:stm32mp2common = "stm32mp257f-dk.dts"

# =========================================================================
# U-BOOT extlinux.conf
# =========================================================================
# Boot the board-specific kernel devicetree by default
UBOOT_EXTLINUX_FDT = "/stm32mp257d-atk-ddr-2GB.dtb"

# =========================================================================
# Flashlayout
# =========================================================================
# Set the FLASHLAYOUT_TYPE_LABELS for 'extensible' to the kernel dts name
FLASHLAYOUT_TYPE_LABELS:extensible = "stm32mp257d-atk-ddr-2GB"

# ==========================================================================
# M33 Copro
# ==========================================================================
# Manual M33 startup: M33_BOARDS_START_AT_STARTUP is intentionally NOT set so
# that st-m33firmware-load-default.sh finds no default.$board marker and never
# auto-starts the copro at boot. Developers start the M33 by hand, e.g.:
#   cd /usr/local/Cube-M33-examples/<proj> && ./fw_cortex_m33.sh start
# or (firmware copied to /lib/firmware/):
#   echo <fw>.elf > /sys/class/remoteproc/remoteprocX/firmware
#   echo start    > /sys/class/remoteproc/remoteprocX/state
#M33_BOARDS_START_AT_STARTUP = "stm32mp257d-atk"

# supported m33fw board
M33FW_BOARDS += "stm32mp257d-atk-ddr-2GB"
# project name on m33tdprojects-starter-stm32mp2
# (OpenAMP echo example from STM32CubeMP2; ATK resmem matches the shared
#  stm32mp2xx_DDR_m33_ns.ld layout: NS vector @0x80100000, IPC_SHMEM @0x81200000,
#  VIRTIO @0x812f8000. The CMake build files are injected by the
#  m33projects-stm32mp2 bbappend in this layer.)
M33FW_FIRMWARE[stm32mp257d-atk-ddr-2GB] ?= "Projects/STM32MP257F-EV1/Applications/OpenAMP/OpenAMP_TTY_echo,OpenAMP_TTY_echo"
# Default project to used
M33FW_DEFAULT_FIRMWARE[stm32mp257d-atk-ddr-2GB] ?= "OpenAMP_TTY_echo"
# Define tf-m platform path
M33FW_TFM_PLATFORM[stm32mp257d-atk-ddr-2GB] ?= "stm/stm32mp257f_ev1"
# Define tf-m platform extra opts config (bbclass requires the flag to be set)
M33FW_TFM_OPTFLAGS[stm32mp257d-atk-ddr-2GB] ?= "-DTEST_NS_PS=OFF"
